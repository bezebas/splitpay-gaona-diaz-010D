server:
  port: 8083

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: usuario-service
          uri: http://localhost:8067
          predicates:
            - Path=/usuarios/**

        - id: grupos-service
          uri: http://localhost:8068
          predicates:
            - Path=/grupos/**

        - id: miembros-service
          uri: http://localhost:8068
          predicates:
            - Path=/miembros/**

        - id: gastos-service
          uri: http://localhost:8070
          predicates:
            - Path=/gastos/**

        - id: evento-service
          uri: http://localhost:8082
          predicates:
            - Path=/eventos/**

        - id: balances-service
          uri: http://localhost:8071
          predicates:
            - Path=/balances/**

        - id: pagos-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/pagos/**


     
        - id: notificaciones-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/notificaciones/**



        - id: reportes-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/reportes/**



        - id: historial-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/historial/**


        - id: reputacion-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/reputacion/**